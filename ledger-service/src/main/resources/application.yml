spring:
  application:
    name: ledger-service

  # Runtime connection uses the least-privilege quotient_app role so RLS applies.
  datasource:
    url: jdbc:postgresql://localhost:5432/quotient
    username: quotient_app
    password: quotient_app
    hikari:
      # quotient_app is created by a Flyway migration that runs first; do not
      # eagerly open the pool before the app actually serves a request.
      minimum-idle: 0

  # Flyway runs as the schema owner (superuser) to create roles, tables, RLS.
  flyway:
    url: jdbc:postgresql://localhost:5432/quotient
    user: quotient
    password: quotient
    locations: classpath:db/migration

  jackson:
    serialization:
      write-dates-as-timestamps: false

  kafka:
    bootstrap-servers: localhost:29092
    template:
      observation-enabled: true
    listener:
      observation-enabled: true
    consumer:
      group-id: quotient-ledger-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      isolation-level: read_committed
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true

server:
  port: 8086

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: always
  metrics:
    tags:
      application: ledger-service
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${QUOTIENT_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  structured:
    format:
      console: ecs

quotient:
  ledger:
    charges-topic: billing.charges.v1
    invoice-created-topic: invoice.created.v1
    # 10% GST is applied in the domain; kept here for documentation only.
    gst-rate: "0.10"

# Set to true (with --spring.main.web-application-type=none) to run the
# ledger-verify task; the process exits non-zero if balances have drifted.
ledger:
  verify:
    enabled: false
