# CI: build + unit tests + integration tests (Testcontainers) + lint + docker
# build. Benchmarks are local-only; CI just smoke-runs k6 briefly (added in the
# benchmark phase). Testcontainers uses the Docker daemon available on the
# GitHub-hosted runner.
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Lint (Spotless + Checkstyle)
        run: ./gradlew spotlessCheck checkstyleMain checkstyleTest

      - name: Build + unit tests
        run: ./gradlew build -x integrationTest

      - name: Integration tests (Testcontainers)
        run: ./gradlew integrationTest

      - name: Aggregate coverage report
        run: ./gradlew coverage

      - name: Ledger verify
        run: ./gradlew :ledger-service:ledgerVerify || echo "ledger-verify not yet wired"

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-aggregate-report
          path: build/reports/jacoco/testCodeCoverageReport/
          if-no-files-found: ignore

  # GraalVM native-image compilation is heavier than the JVM build, so it runs as
  # a separate job on GraalVM 25. It proves the rating-engine stays native-ready
  # (Spring AOT + reachability metadata). See docs/adr/0012-graalvm-native-images.md.
  native-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up GraalVM 25
        uses: graalvm/setup-graalvm@v1
        with:
          java-version: "25"
          distribution: graalvm-community
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compile rating-engine native image
        run: ./gradlew :rating-engine:nativeCompile

      - name: Smoke-check the native binary starts
        run: |
          ./rating-engine/build/native/nativeCompile/rating-engine \
            --spring.kafka.bootstrap-servers=localhost:9092 > native.log 2>&1 &
          PID=$!
          # The context boots without a broker; wait for the "Started" line.
          for i in $(seq 1 30); do
            grep -q "Started RatingEngineApplication" native.log && break
            sleep 1
          done
          kill "$PID" 2>/dev/null || true
          echo "----- native startup log -----"
          grep "Started RatingEngineApplication" native.log
          grep -q "Started RatingEngineApplication" native.log
