spring:
  application:
    name: ingest-gateway-vthreads

  # Project Loom: serve each request on a virtual thread so blocking Kafka acks
  # scale without a large platform-thread pool.
  threads:
    virtual:
      enabled: true

  kafka:
    bootstrap-servers: localhost:29092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
        delivery.timeout.ms: 8000
        request.timeout.ms: 4000

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  metrics:
    tags:
      application: ingest-gateway-vthreads

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# ---------------------------------------------------------------------------
# Ingestion configuration. Demo API keys map to the three canonical tenants.
# In a real deployment these live in a secret store, not application.yml.
# ---------------------------------------------------------------------------
quotient:
  ingest:
    topic: usage.events.v1
    ack-timeout: 5s
    max-future-skew: 5m
    dedup-ttl: 24h
    rate-limit:
      capacity: 2000
      refill-tokens: 2000
      refill-period: 1s
    meters:
      - llm.tokens.input
      - llm.tokens.output
      - llm.requests
      - storage.gb
    api-keys:
      - tenant-id: 11111111-1111-1111-1111-111111111111
        keys:
          - qk_live_acme_primary
          - qk_live_acme_rotating
      - tenant-id: 22222222-2222-2222-2222-222222222222
        keys:
          - qk_live_globex_primary
      - tenant-id: 33333333-3333-3333-3333-333333333333
        keys:
          - qk_live_initech_primary
