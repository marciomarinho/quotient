spring:
  application:
    name: ingest-gateway-reactive

  # WebFlux/Netty event loop — no virtual threads here (the point of the
  # comparison with ingest-gateway-vthreads).
  kafka:
    bootstrap-servers: localhost:29092

  data:
    redis:
      host: localhost
      port: 6379

server:
  port: 8082

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  metrics:
    tags:
      application: ingest-gateway-reactive
    distribution:
      percentiles-histogram:
        http.server.requests: true
  tracing:
    sampling:
      probability: 1.0
  otlp:
    tracing:
      endpoint: ${QUOTIENT_OTLP_ENDPOINT:http://localhost:4318/v1/traces}

logging:
  structured:
    format:
      console: ecs

springdoc:
  swagger-ui:
    path: /swagger-ui.html

# Same ingestion contract/config as the vthreads gateway.
quotient:
  ingest:
    topic: usage.events.v1
    ack-timeout: 5s
    max-future-skew: 5m
    dedup-ttl: 24h
    rate-limit:
      capacity: 2000
      refill-tokens: 2000
      refill-period: 1s
    meters:
      - llm.tokens.input
      - llm.tokens.output
      - llm.requests
      - storage.gb
    api-keys:
      - tenant-id: 11111111-1111-1111-1111-111111111111
        keys:
          - qk_live_acme_primary
          - qk_live_acme_rotating
      - tenant-id: 22222222-2222-2222-2222-222222222222
        keys:
          - qk_live_globex_primary
      - tenant-id: 33333333-3333-3333-3333-333333333333
        keys:
          - qk_live_initech_primary
