# Version catalog — single source of truth for dependency versions.
# See https://docs.gradle.org/current/userguide/version_catalogs.html
#
# This replaces the <dependencyManagement> / <properties> block a Maven parent
# POM would carry. Bump a version here and every module picks it up.

[versions]
java = "25"
springBoot = "3.5.4"
springDependencyManagement = "1.1.7"
spotless = "7.2.1"
errorprone = "2.36.0"
errorpronePlugin = "4.1.0"
checkstyle = "10.21.1"

# Libraries whose versions are NOT managed by the Spring Boot BOM.
bucket4j = "8.10.1"
archunit = "1.3.0"
jqwik = "1.9.2"
blockhound = "1.0.11.RELEASE"
testcontainersKeycloak = "3.5.1"
reactorKafka = "1.3.23"
argon2 = "2.11"
otelInstrumentation = "2.11.0"

[libraries]
# --- Gradle plugin artifacts consumed by the build-logic convention plugin ---
# (precompiled script plugins apply third-party plugins via their marker jars)
spotless-gradle = { module = "com.diffplug.spotless:spotless-plugin-gradle", version.ref = "spotless" }
errorprone-gradle = { module = "net.ltgt.gradle:gradle-errorprone-plugin", version.ref = "errorpronePlugin" }
errorprone-core = { module = "com.google.errorprone:error_prone_core", version.ref = "errorprone" }

# --- Spring Boot BOM-managed (no version here) ---
spring-boot-starter = { module = "org.springframework.boot:spring-boot-starter" }
spring-boot-starter-web = { module = "org.springframework.boot:spring-boot-starter-web" }
spring-boot-starter-webflux = { module = "org.springframework.boot:spring-boot-starter-webflux" }
spring-boot-starter-validation = { module = "org.springframework.boot:spring-boot-starter-validation" }
spring-boot-starter-actuator = { module = "org.springframework.boot:spring-boot-starter-actuator" }
spring-boot-starter-security = { module = "org.springframework.boot:spring-boot-starter-security" }
spring-boot-starter-oauth2-resource-server = { module = "org.springframework.boot:spring-boot-starter-oauth2-resource-server" }
spring-boot-starter-data-jdbc = { module = "org.springframework.boot:spring-boot-starter-data-jdbc" }
spring-boot-starter-jooq = { module = "org.springframework.boot:spring-boot-starter-jooq" }
spring-boot-starter-test = { module = "org.springframework.boot:spring-boot-starter-test" }
spring-boot-testcontainers = { module = "org.springframework.boot:spring-boot-testcontainers" }
spring-kafka = { module = "org.springframework.kafka:spring-kafka" }
spring-kafka-test = { module = "org.springframework.kafka:spring-kafka-test" }
spring-data-redis = { module = "org.springframework.boot:spring-boot-starter-data-redis" }

# --- Kafka Streams / Reactor Kafka ---
kafka-streams = { module = "org.apache.kafka:kafka-streams" }
reactor-kafka = { module = "io.projectreactor.kafka:reactor-kafka", version.ref = "reactorKafka" }

# --- Persistence ---
postgresql = { module = "org.postgresql:postgresql" }
flyway-core = { module = "org.flywaydb:flyway-core" }
flyway-postgresql = { module = "org.flywaydb:flyway-database-postgresql" }

# --- Observability ---
micrometer-registry-prometheus = { module = "io.micrometer:micrometer-registry-prometheus" }
micrometer-tracing-bridge-otel = { module = "io.micrometer:micrometer-tracing-bridge-otel" }
otel-exporter-otlp = { module = "io.opentelemetry:opentelemetry-exporter-otlp" }

# --- Rate limiting / auth ---
bucket4j-core = { module = "com.bucket4j:bucket4j-core", version.ref = "bucket4j" }
argon2 = { module = "de.mkammerer:argon2-jvm", version.ref = "argon2" }

# --- Testing ---
archunit-junit5 = { module = "com.tngtech.archunit:archunit-junit5", version.ref = "archunit" }
jqwik = { module = "net.jqwik:jqwik", version.ref = "jqwik" }
blockhound = { module = "io.projectreactor.tools:blockhound", version.ref = "blockhound" }
testcontainers-junit = { module = "org.testcontainers:junit-jupiter" }
testcontainers-kafka = { module = "org.testcontainers:kafka" }
testcontainers-postgresql = { module = "org.testcontainers:postgresql" }
testcontainers-redis = { module = "com.redis:testcontainers-redis", version = "2.2.2" }
testcontainers-keycloak = { module = "com.github.dasniko:testcontainers-keycloak", version.ref = "testcontainersKeycloak" }
assertj = { module = "org.assertj:assertj-core", version = "3.27.3" }
rest-assured = { module = "io.rest-assured:rest-assured" }
awaitility = { module = "org.awaitility:awaitility" }

[plugins]
spring-boot = { id = "org.springframework.boot", version.ref = "springBoot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "springDependencyManagement" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
errorprone = { id = "net.ltgt.errorprone", version.ref = "errorpronePlugin" }
